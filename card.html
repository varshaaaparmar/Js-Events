<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practise</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    #main{
    background-image : url("https://i.pinimg.com/736x/ae/37/c2/ae37c24fff2b39c5b71bd0c6d800b0fa.jpg");
    background-size: cover;
    width: 100%;
    min-height: 100vh;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
    #form {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0 auto;
}

.inputs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 300px;
}
h1{
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    margin-top: 20px;
}
#name, #url, #price, #description{
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    
}
#submitButton{
    padding: 10px;
    border-radius: 5px;
    border: none;
    background-color: #7706198e;
    color: white;
    cursor: pointer;
    font-size: 16px;
}
#submitButton:hover{
    background-color: white;
    color:#3d030d8e ;
    font-weight: bold;
}
.card{
    width: 300px;
    height: 500px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
    margin-left: 20px;
    padding: 20px;
    text-align: center;
    background-color: rgba(255, 255, 255, 0.8);
}
.card .profile{
    width: 250px;
    height: 200px;
    overflow: hidden;
    margin: 0 auto;
}
.card .profile img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.card h2{
    font-size: 24px;
    margin: 10px 0;
    color: rgb(61, 2, 14);
}
.card p{
    font-size: 16px;
    color: rgb(61, 2, 14);
}
.buyNowButton, .addToCartButton{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    background-color: #440407;
    color: white;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
    height: 40px;
    width: 100%;
}
.buyNowButton:hover, .addToCartButton:hover{
    background-color: white;
    color:#3d030d ;
    font-weight: bold;
}
.productImage:hover{
    transform: scale(1.1);
    transition: transform 0.5s ease-in-out;
}
.btn2-afterEff::after{
    content: "✓";
}


</style>
<body>
    <div id="main">
        <form id="form">
            <h1>Product Form</h1>
            <div class="inputs">
            <input type="text" id="name" placeholder="Product Name">
            <input type="text" id="url" placeholder="Product url">
            <input type="text" id="price" placeholder="Product price">
            <input type="text" id="description" placeholder="Product description">
            <input type="submit" value="Submit" id="submitButton">
            </div>
        </form>
        </div>
        <script src="card.js"></script>
</body>
</html>
